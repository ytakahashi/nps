name: Deno

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }} # runs a test on Ubuntu, Windows and macOS

    strategy:
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Setup repo
        uses: actions/checkout@v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "v2.x"

      - name: Lint
        run: deno lint

      - name: Check code format
        if: matrix.os != 'windows-latest'
        run: deno fmt --check

      - name: Run Tests
        run: deno test --allow-read --allow-net
